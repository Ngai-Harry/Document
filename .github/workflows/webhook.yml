name: Discord Webhook

on:
  push:
    branches: [ "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Discord
        env:
          DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1538386176506073220/0jdWYSPb4laDxeVknLX41yRz7gu5FSytVrt29Gzv9Xg7FPiNr85hxueLjX6hcalp61g8"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg title "🚀 Có commit mới!" \
            --arg url "$COMMIT_URL" \
            --arg desc "**Commit:** $COMMIT_MSG\n🔗 **Xem chi tiết thay đổi:** [Nhấn vào đây]($COMMIT_URL)" \
            --arg author "$AUTHOR_NAME" \
            --arg repo "$REPO_NAME" \
            --arg branch "$BRANCH_NAME" \
            '{
              username: "GitHub CI/CD",
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $desc,
                  color: 5814783,
                  fields: [
                    { name: "👤 Người commit", value: $author, inline: true },
                    { name: "📦 Repository", value: $repo, inline: true },
                    { name: "🌿 Branch", value: $branch, inline: true }
                  ],
                  footer: { text: "GitHub CI/CD" }
                }
              ]
            }' | curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"